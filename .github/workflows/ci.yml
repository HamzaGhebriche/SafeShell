name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable:
    env:
      SAFESHELL_PORTABLE_CI: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest ruff==0.17.3 build 'setuptools>=77'
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -ra --ignore=tests/test_linux_boundary.py
        if: runner.os == 'Linux'
      - run: python -m pytest -ra
        if: runner.os != 'Linux'
      - run: python -m build --no-isolation
      - run: python tools/smoke_installed.py dist/safeshell_cli-0.1.0a1-py3-none-any.whl
  linux-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SAFESHELL_REQUIRE_BACKEND: '1'
      SAFESHELL_EXPECT_APPARMOR_PROFILE: safeshell-bwrap//&safeshell-child
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap libseccomp2 build-essential python3-venv apparmor
      - name: Load application-scoped Bubblewrap setup policy
        run: |
          sudo apparmor_parser --replace .github/apparmor/safeshell-bwrap
          sysctl kernel.apparmor_restrict_unprivileged_userns
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
      - run: python -m pip install pytest build 'setuptools>=77'
      - run: python tools/validate_linux.py
      - name: Record namespace policy diagnostics
        if: failure()
        run: |
          sudo aa-status
          sudo journalctl -k --no-pager -n 80
      - run: python -m build --no-isolation
      - run: python tools/smoke_installed.py dist/safeshell_cli-0.1.0a1-py3-none-any.whl --require-backend > validation-results/installed-smoke.json
      - run: python tools/prepare_release_assets.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: alpha-distributions
          path: |
            dist/safeshell_cli-0.1.0a1-py3-none-any.whl
            dist/safeshell_cli-0.1.0a1.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-enforcement-evidence
          path: validation-results/
          if-no-files-found: error
